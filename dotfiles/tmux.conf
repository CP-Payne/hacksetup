# ---- basics ----------------------------------------------------------------
set -g prefix C-a                  # Ctrl+a instead of Ctrl+b
unbind C-b
bind C-a send-prefix
set -g mouse on                    # click panes/windows, scroll output
set -g history-limit 100000
set -g base-index 1                # windows start at 1 (matches keyboard)
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -sg escape-time 10
setw -g mode-keys vi               # prefix+[ to scroll/copy with vim keys
set -g status-interval 5

# ---- windows & panes -------------------------------------------------------
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind , command-prompt -I "#W" "rename-window '%%'"

# Same keys if Ctrl is still held after the prefix (Ctrl+A, Ctrl+C = Ctrl+A, c)
bind C-c new-window -c "#{pane_current_path}"
bind C-d detach-client
bind C-s choose-tree -Zs
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

# ---- vim keys for terminal output --------------------------------------------
bind Escape copy-mode              # prefix+Esc = normal mode in the output
bind / copy-mode \; command-prompt -T search -p "(search up)" "send-keys -X search-backward '%%'"
bind -T copy-mode-vi i send-keys -X cancel
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# Alt+1..9 jumps straight to a window — no prefix needed
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# prefix+s = tree of all sessions/windows (built in). prefix+w = windows only.
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# prefix+P toggles logging the current pane to ~/tmux-logs (evidence!)
bind P pipe-pane -o 'mkdir -p ~/tmux-logs && cat >> ~/tmux-logs/#{session_name}_#{window_name}_#{pane_index}.log' \; display "Toggled pane logging"

# ---- status bar ------------------------------------------------------------
set -g status-position top
set -g status-style "bg=colour235,fg=colour250"
set -g status-left-length 30
set -g status-left "#[bold,fg=colour39] #S #[default]  "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=colour39,fg=colour16,bold] #I:#W "
# tun0 IP (HTB/VPN) + time on the right
set -g status-right-length 60
set -g status-right '#[fg=colour114]#(ip -4 -o addr show tun0 2>/dev/null | awk "{print \$4}" | cut -d/ -f1)#[default]  %H:%M '
